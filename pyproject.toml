[project]
name = "hexlet-code"
version = "0.1.0"
description = "gendiff project"
readme = "README.md"
authors = [
    { name = "shayakhmetovii", email = "shayakhmetovii@icloud.com" },
]
packages = [
    { include = 'gendiff' },
]
requires-python = ">=3.13"
dependencies = [
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gendiff"]

[project.scripts]
gendiff = "gendiff.scripts.gendiff:main"
